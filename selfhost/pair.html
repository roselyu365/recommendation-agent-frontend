<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接陪读插件</title><link rel="stylesheet" href="/setup.css"><script src="/pair.js" defer></script></head><body><header><a class="brand" href="/experience.html">纸间 <small>阅读花园</small></a><a href="/setup.html">使用与连接 ↗</a></header><main><section class="intro"><span class="eyebrow">CONNECT / 仅连接本机</span><h1>让选中的文字，<br>来到这里。</h1><p>请核对这是你刚刚发起的 SHU 插件请求，<br>不要批准不认识的扩展。</p></section><section class="paper"><div class="heading"><h2>等待批准的连接</h2><button id="refresh" class="outline">刷新请求</button></div><p>批准只建立本机连接，不会自动发送原文。回到阅读页，点击“看懂这段”或“发送问题”时才把当前选段交给模型；批注留在本机。</p><div id="requests">正在检查连接请求…</div><p id="status" role="status" aria-live="polite"></p><p><a href="/setup.html">查看或断开已批准的连接 ↗</a></p></section></main></body></html>
