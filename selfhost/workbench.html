<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHU · 高亮识别实验</title>
<style>body{margin:0;background:#f6f2e9;color:#21352e;font:16px system-ui}header{padding:24px 4vw;border-bottom:1px solid #d7d4c9}h1{font-size:24px;margin:5px 0}small{color:#666}main{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;padding:24px 4vw}section,aside{background:#fff;border:1px solid #ddd8ce;border-radius:16px;padding:20px;min-width:0}button,select,input{font:inherit;padding:10px;border:1px solid #bbb;border-radius:8px;margin:5px 0}button{background:#214a3e;color:white;cursor:pointer}button:disabled{opacity:.5}img{max-width:100%;max-height:64vh;display:block;margin:15px auto}textarea{width:100%;box-sizing:border-box;min-height:240px;padding:14px;font:18px/1.8 system-ui;border:1px solid #bbb;border-radius:8px}p{line-height:1.7}.status{color:#7e4d00}#pair{max-width:100%;box-sizing:border-box;width:100%}@media(max-width:700px){main{grid-template-columns:1fr}}</style>
<header><small>SHU / 独立验证原型 · 不生成解析</small><h1>只看你划亮的这一段</h1><p>本机 Apple Vision 识别。测试页模拟侧栏布局，不代表 Chrome 插件已安装。</p></header>
<main><section><label for="sample">测试样本</label><select id="sample"><option value="actual-selection">真实微信读书选区</option><option value="multiline">跨行 · 人工测试图</option><option value="long">长段 · 人工测试图</option><option value="light">浅色背景 · 人工测试图</option><option value="occluded">菜单遮挡 · 人工测试图</option><option value="none">无高亮 · 人工测试图</option></select><p><label>也可以选择本机截图 <input id="upload" type="file" accept="image/png"></label></p><img id="preview" alt="识别前的截图"><button id="recognize">陪读 · 识别高亮</button></section>
<aside><small>01 / 原文校对</small><h2>识别结果，待核对</h2><p class="status" id="status" role="status">尚未识别</p><textarea id="result" aria-label="可修改的识别原文" placeholder="点击左侧按钮后在这里校对"></textarea><p id="warning">仅支持蓝色高亮。遮挡和屏幕外文字不会恢复，不自动补全。没有自动发送、解析或保存。</p><button id="clear">清空结果</button><details><summary>连接实验插件</summary><p>此配对码只给本机实验插件，不要分享。重启服务后失效。</p><input id="pair" readonly type="password" aria-label="本机配对码"><button id="show">显示配对码</button></details></aside></main><script src="/workbench.js"></script></html>
